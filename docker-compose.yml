services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lexgate_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:17-alpine
    container_name: lexgate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lexgate
      POSTGRES_USER: lexgate_admin
      POSTGRES_PASSWORD: lexgate_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pg_storage:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: lexgate_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_storage:/data

  ollama:
    image: ollama/ollama:latest
    container_name: lexgate_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  qdrant_storage:
  pg_storage:
  redis_storage:
  ollama_models:
